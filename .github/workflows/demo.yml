# Publie la demo statique sur GitHub Pages.
#
# Elle vivait jusqu'ici derriere un tunnel Cloudflare, ce qui imposait trois
# contraintes a chaque test : le PC allume, le tunnel lance, et une adresse
# qui change a chaque redemarrage. Un testeur ouvre le lien quand ca l'arrange,
# pas quand la machine est prete. Pages donne une adresse definitive, gratuite,
# et se met a jour par un simple push.
#
# Prealable a faire une fois, a la main : Settings > Pages > Source =
# "GitHub Actions". Sans ca, l'etape configure-pages echoue en le disant.

name: Demo

on:
  push:
    branches: [main, feat/portage-web, feat/ligues-et-xp, feat/onboarding-et-coach, chore/retrait-desktop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploiement en cours n'est jamais annule : mieux vaut publier deux fois
# de suite que laisser le site a moitie remplace.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Toutes les verifications, en quelques secondes : les donnees de
      # `web/static/donnees/` (des sources editees a la main, que plus rien ne
      # valide en les fabriquant), les tables du coach, et les tests figes. Un
      # rouge empeche de publier — une donnee bancale ne leve jamais dans
      # l'application, elle y tait une fiche ou y refuse une seance. Node est
      # deja present sur le runner.
      - name: Verifier
        run: node scripts/tester.mjs

      # `empreinte_deploiement` n'utilise que la bibliotheque standard.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # La racine du site est le sommaire : une carte par page (application,
      # demo, outils de reglage), generee depuis les <title> et les
      # <meta name="description">. Une page ajoutee y apparait d'elle-meme.
      - name: Preparer le dossier a publier
        run: |
          cp -r web/static _site
          node scripts/sommaire.mjs _site "${{ github.sha }}"

      # Chaque ressource locale recoit l'empreinte du commit deploye. Sans ca,
      # un navigateur qui tient encore l'ancien module en cache le combine avec
      # le nouveau document : l'application echoue sur une fonction disparue et
      # accuse un code deja corrige. C'est arrive, sur un iPad, au demarrage
      # d'une seance. Le cache n'est pas en cause — sa granularite l'est, chaque
      # fichier expirant pour son compte. Changer l'adresse plutot qu'esperer
      # l'expiration est la seule facon d'etre sur qu'un deploiement est servi
      # entier.
      - name: Marquer les ressources avec l'empreinte du commit
        run: python -m scripts.empreinte_deploiement _site "${{ github.sha }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
