<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Trainer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg: #0a0d13;
            --glass: rgba(15, 19, 28, 0.6);
            --glass-strong: rgba(15, 19, 28, 0.82);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text: #f4f2ec;
            --muted: #8d97ab;
            --orange: #ff5a36;
            --orange-glow: rgba(255, 90, 54, 0.45);
            --teal: #1be8c4;
            --teal-glow: rgba(27, 232, 196, 0.45);
            --blue: #4da3ff;
            --blue-glow: rgba(77, 163, 255, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', Arial, sans-serif;
            overflow: hidden;
        }

        /* ---------- STAGE (full-bleed camera) ---------- */

        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.05) contrast(1.03);
            animation: fadeIn 0.9s ease both;
        }

        /* subtle vignette + scanline for a "broadcast HUD" feel */
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.6) 100%);
        }

        .scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.05;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.6) 0px,
                rgba(255,255,255,0.6) 1px,
                transparent 1px,
                transparent 3px
            );
            mix-blend-mode: overlay;
        }

        /* ---------- TOP BAR ---------- */

        .topbar {
            position: absolute;
            top: 28px;
            left: 28px;
            right: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            animation: dropIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 10px 18px 10px 14px;
            border-radius: 999px;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--orange);
            box-shadow: 0 0 10px var(--orange-glow);
            animation: pulseDot 2s ease-in-out infinite;
        }

        .brand-name {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.02em;
        }

        .brand-name span {
            color: var(--teal);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 8px var(--teal-glow);
            animation: pulseDot 1.6s ease-in-out infinite;
        }

        .status-dot.offline {
            background: #ff5a5a;
            box-shadow: 0 0 8px rgba(255, 90, 90, 0.5);
        }

        .exercise-badge {
            display: flex;
            align-items: baseline;
            gap: 9px;
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 9px 20px;
            border-radius: 999px;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .exercise-badge.changing {
            opacity: 0;
            transform: translateY(-4px);
        }

        .exercise-label {
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .exercise-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.01em;
        }

        .topbar-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .series-badge {
            display: flex;
            align-items: baseline;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 9px 18px;
            border-radius: 999px;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .series-badge.changing {
            opacity: 0;
            transform: translateY(-4px);
        }

        .series-label {
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .series-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--orange);
            letter-spacing: 0.01em;
        }

        .weight-badge {
            display: flex;
            align-items: baseline;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 9px 18px;
            border-radius: 999px;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .weight-badge.changing {
            opacity: 0;
            transform: translateY(-4px);
        }

        .weight-label {
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .weight-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--teal);
            letter-spacing: 0.01em;
        }

        /* ---------- HOLD BUBBLE (progression du maintien) ---------- */

        .hold-container {
            position: absolute;
            top: 34%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .hold-container.visible {
            opacity: 1;
        }

        .hold-ring-wrap {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hold-ring {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .hold-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.14);
            stroke-width: 6;
        }

        .hold-ring-progress {
            fill: none;
            stroke: var(--teal);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 439.8;
            stroke-dashoffset: 439.8;
            filter: drop-shadow(0 0 6px var(--teal-glow));
            transition: stroke-dashoffset 0.12s linear;
        }

        .hold-container.flash .hold-ring-progress {
            animation: ringFlash 0.5s ease-out;
        }

        .hold-bubble {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%,
                rgba(255, 255, 255, 0.85),
                rgba(27, 232, 196, 0.45) 42%,
                rgba(27, 232, 196, 0.16) 72%,
                transparent 100%);
            box-shadow: 0 0 26px var(--teal-glow) inset, 0 0 18px var(--teal-glow);
            transform: scale(0.22);
            transition: transform 0.15s ease-out;
            animation: bubbleGlow 2.4s ease-in-out infinite;
        }

        .hold-bubble.pop {
            animation: bubblePop 0.55s cubic-bezier(0.32, 0, 0.67, 0) forwards;
        }

        .hold-percent {
            position: absolute;
            font-family: 'Bebas Neue', 'Space Grotesk', sans-serif;
            font-size: 26px;
            letter-spacing: 0.02em;
            color: var(--text);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
            pointer-events: none;
        }

        .hold-caption {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .burst {
            position: absolute;
            inset: 0;
            overflow: visible;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 8px var(--teal-glow);
            transform: translate(-50%, -50%);
            animation: particleBurst 0.6s ease-out forwards;
        }

        /* ---------- REST OVERLAY (phase de récupération) ---------- */

        .rest-overlay {
            position: absolute;
            inset: 0;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: rgba(9, 12, 18, 0.74);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .rest-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .rest-title {
            font-size: 13px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .breathe-circle {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 34% 30%,
                rgba(255, 255, 255, 0.55),
                rgba(77, 163, 255, 0.45) 45%,
                rgba(77, 163, 255, 0.14) 75%,
                transparent 100%);
            box-shadow: 0 0 46px var(--blue-glow);
            animation: breathe 4s ease-in-out infinite;
        }

        .rest-time {
            font-family: 'Bebas Neue', 'Space Grotesk', sans-serif;
            font-size: 56px;
            letter-spacing: 0.02em;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .rest-next {
            font-size: 14px;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        .rest-next strong {
            color: var(--text);
            font-weight: 700;
        }

        .prep-ring-wrap {
            position: relative;
            width: 170px;
            height: 170px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .prep-ring-wrap.active {
            display: flex;
        }

        .prep-ring {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .prep-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.14);
            stroke-width: 6;
        }

        .prep-ring-progress {
            fill: none;
            stroke: var(--orange);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 439.8;
            stroke-dashoffset: 439.8;
            filter: drop-shadow(0 0 8px var(--orange-glow));
            transition: stroke-dashoffset 0.12s linear;
        }

        .prep-percent {
            position: absolute;
            font-family: 'Bebas Neue', 'Space Grotesk', sans-serif;
            font-size: 46px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .breathe-circle.hidden-mode {
            display: none;
        }

        /* ---------- SIDE PANEL (position + étape, bord gauche) ---------- */

        .side-panel {
            position: absolute;
            left: 28px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: slideInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.15s;
        }

        /* ---------- HUD (bottom-right overlay) ---------- */

        .hud {
            position: absolute;
            right: 28px;
            bottom: 28px;
            z-index: 5;
            display: flex;
            justify-content: flex-end;
            animation: riseIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.15s;
        }

        .series-controls {
            position: absolute;
            left: 28px;
            bottom: 28px;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: min(620px, calc(100vw - 56px));
        }

        .series-controls button {
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            background: var(--glass-strong);
            font: inherit;
            cursor: pointer;
        }

        .series-controls button:hover {
            border-color: var(--teal);
            color: var(--teal);
        }

        .card {
            background: var(--glass-strong);
            border: 1px solid var(--border-strong);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        /* Position card */
        .position-card {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 200px;
        }

        .label {
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .position-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--orange);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .position-value.changing {
            opacity: 0;
            transform: translateY(6px);
        }

        /* Stage card */
        .stage-card {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 200px;
        }

        .stage-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--teal);
            text-transform: capitalize;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .stage-value.changing {
            opacity: 0;
            transform: translateY(6px);
        }

        /* Reps card — the signature scoreboard */
        .reps-card {
            padding: 18px 34px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            position: relative;
            overflow: visible;
        }

        .reps-value-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 150px;
            height: 110px;
        }

        .impact-ring {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--teal);
            opacity: 0;
            pointer-events: none;
        }

        .impact-ring.hit {
            animation: ringPulse 0.55s ease-out;
        }

        .reps-value {
            font-family: 'Bebas Neue', 'Space Grotesk', sans-serif;
            font-size: 92px;
            line-height: 1;
            color: var(--teal);
            text-shadow: 0 0 24px var(--teal-glow);
            letter-spacing: 0.02em;
        }

        .reps-value.hit {
            animation: punch 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .reps-target {
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 0.04em;
            margin-top: -4px;
        }

        .reps-target strong {
            color: var(--text);
            font-weight: 700;
        }

        .reps-progress-track {
            width: 132px;
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin-top: 10px;
        }

        .reps-progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--teal), #7cf5da);
            transition: width 0.3s ease;
        }

        /* ---------- WORKOUT CARD (multi-modes : répétitions / maintien / chrono / amrap) ---------- */
        /* Un seul bloc est visible à la fois, piloté par [data-mode] sur #workoutCard.
           Le backend décide de la valeur de "mode" ; le CSS/JS ne fait qu'afficher. */

        .workout-block {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        #workoutCard[data-mode="repetitions"] .workout-block--repetitions,
        #workoutCard[data-mode="maintien"] .workout-block--maintien,
        #workoutCard[data-mode="chrono"] .workout-block--chrono,
        #workoutCard[data-mode="amrap"] .workout-block--amrap {
            display: flex;
        }

        .maintien-status {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--teal);
            transition: color 0.25s ease;
        }

        .maintien-status--erreur {
            color: var(--orange);
        }

        .chrono-value {
            font-family: 'Bebas Neue', 'Space Grotesk', sans-serif;
            font-size: 92px;
            line-height: 1;
            color: var(--blue);
            text-shadow: 0 0 24px var(--blue-glow);
            letter-spacing: 0.02em;
        }

        .amrap-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        /* ---------- Animations ---------- */

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translate(-18px, -50%); }
            to { opacity: 1; transform: translate(0, -50%); }
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.6; }
        }

        @keyframes punch {
            0%   { transform: scale(1); }
            35%  { transform: scale(1.28); }
            60%  { transform: scale(0.94); }
            100% { transform: scale(1); }
        }

        @keyframes ringPulse {
            0%   { opacity: 0.9; transform: scale(0.6); }
            100% { opacity: 0; transform: scale(1.9); }
        }

        @keyframes bubbleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.18); }
        }

        @keyframes bubblePop {
            0%   { transform: scale(1);   opacity: 1; }
            35%  { transform: scale(1.32); opacity: 1; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        @keyframes ringFlash {
            0%   { stroke: var(--teal); filter: drop-shadow(0 0 6px var(--teal-glow)); }
            40%  { stroke: #ffffff; filter: drop-shadow(0 0 22px var(--teal-glow)); }
            100% { stroke: var(--teal); filter: drop-shadow(0 0 6px var(--teal-glow)); }
        }

        @keyframes particleBurst {
            to {
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty)));
                opacity: 0;
            }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.86); }
            50% { transform: scale(1.14); }
        }

        /* ---------- Responsive ---------- */

        @media (max-width: 760px) {
            .side-panel {
                left: 16px;
                right: 16px;
                top: auto;
                bottom: 28px;
                transform: none;
                flex-direction: row;
                gap: 12px;
                animation: riseIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
                animation-delay: 0.15s;
            }
            .position-card,
            .stage-card {
                flex: 1;
                width: auto;
                padding: 16px 18px;
            }
            .hud {
                position: absolute;
                left: 16px;
                right: 16px;
                bottom: 108px;
                justify-content: center;
            }
            .brand-name {
                font-size: 14px;
            }
            .reps-value {
                font-size: 76px;
            }
            .exercise-value {
                font-size: 14px;
            }
            .hold-ring-wrap {
                width: 130px;
                height: 130px;
            }
            .hold-bubble {
                width: 96px;
                height: 96px;
            }
            .breathe-circle {
                width: 150px;
                height: 150px;
            }
            .rest-time {
                font-size: 42px;
            }
            .prep-ring-wrap {
                width: 140px;
                height: 140px;
            }
            .prep-percent {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                flex-wrap: wrap;
                row-gap: 10px;
            }
            .topbar-center {
                order: 3;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

    </style>
</head>

<body>

<div class="stage">

    <img class="video" id="video" src="/video" alt="Flux webcam">
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div class="topbar">
        <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">Personal<span>Trainer</span></span>
        </div>

        <div class="topbar-center">
            <div class="exercise-badge" id="exerciseBadge">
                <span class="exercise-label">Exercice</span>
                <span class="exercise-value" id="exercice">Aucun</span>
            </div>

            <div class="series-badge" id="seriesBadge">
                <span class="series-label">Série</span>
                <span class="series-value" id="series">1 / 1</span>
            </div>

            <div class="weight-badge" id="weightBadge">
                <span class="weight-label">Poids</span>
                <span class="weight-value" id="weight">—</span>
            </div>
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">En direct</span>
        </div>
    </div>

    <div class="rest-overlay" id="restOverlay">
        <span class="rest-title" id="restTitle">Récupération</span>

        <div class="breathe-circle" id="breatheCircle">
            <span class="rest-time" id="restTime">0:00</span>
        </div>

        <div class="prep-ring-wrap" id="prepRingWrap">
            <svg class="prep-ring" viewBox="0 0 160 160">
                <circle class="prep-ring-bg" cx="80" cy="80" r="70"></circle>
                <circle class="prep-ring-progress" id="prepRingProgress" cx="80" cy="80" r="70"></circle>
            </svg>
            <span class="prep-percent" id="prepPercent">0%</span>
        </div>

        <span class="rest-next" id="restNext">Prochain : —</span>
    </div>

    <div class="hold-container" id="holdContainer">
        <div class="hold-ring-wrap">
            <svg class="hold-ring" viewBox="0 0 160 160">
                <circle class="hold-ring-bg" cx="80" cy="80" r="70"></circle>
                <circle class="hold-ring-progress" id="holdRingProgress" cx="80" cy="80" r="70"></circle>
            </svg>
            <div class="hold-bubble" id="holdBubble"></div>
            <span class="hold-percent" id="holdPercent">0%</span>
            <div class="burst" id="burst"></div>
        </div>
        <span class="hold-caption">Maintien</span>
    </div>

    <div class="side-panel">

        <div class="card position-card">
            <span class="label">Position</span>
            <span class="position-value" id="position">Aucune</span>
        </div>

        <div class="card stage-card">
            <span class="label">Étape</span>
            <span class="stage-value" id="stage">Aucune</span>
        </div>

    </div>

    <div class="hud">

        <div class="card reps-card workout-card" id="workoutCard" data-mode="repetitions">

            <!-- MODE_REPETITIONS : "8 / 12 répétitions" -->
            <div class="workout-block workout-block--repetitions">
                <span class="label">Répétitions</span>
                <div class="reps-value-wrap">
                    <span class="impact-ring" id="ring"></span>
                    <span class="reps-value" id="reps">0</span>
                </div>
                <span class="reps-target">objectif : <strong id="repsCible">10</strong></span>
                <div class="reps-progress-track">
                    <div class="reps-progress-fill" id="repsProgressFill"></div>
                </div>
            </div>

            <!-- MODE_MAINTIEN : "7 / 15 secondes" -->
            <div class="workout-block workout-block--maintien">
                <span class="label">Maintien</span>
                <div class="reps-value-wrap">
                    <span class="impact-ring" id="maintienRing"></span>
                    <span class="reps-value" id="maintienTemps">0</span>
                </div>
                <span class="reps-target">
                    <strong id="maintienTempsTexte">0</strong> / <span id="maintienDureeTexte">0</span> secondes
                </span>
                <div class="reps-progress-track">
                    <div class="reps-progress-fill" id="maintienProgressFill"></div>
                </div>
                <span class="maintien-status" id="maintienStatus">Maintenir la position</span>
            </div>

            <!-- MODE_CHRONO (futur) : "45 secondes restantes" -->
            <div class="workout-block workout-block--chrono">
                <span class="label">Chrono</span>
                <span class="chrono-value" id="chronoTemps">0</span>
                <span class="reps-target">secondes restantes</span>
            </div>

            <!-- MODE_AMRAP (futur) : "12 répétitions en 60 secondes" -->
            <div class="workout-block workout-block--amrap">
                <span class="label">AMRAP</span>
                <div class="amrap-row">
                    <span class="reps-value" id="amrapReps">0</span>
                </div>
                <span class="reps-target"><strong id="amrapTempsRestant">60</strong> secondes restantes</span>
            </div>

        </div>

    </div>

    <nav class="series-controls" aria-label="Commandes de série">
        <button type="button" data-commande="/api/serie/reset">Reset série</button>
        <button type="button" data-commande="/api/serie/recommencer">Recommencer</button>
        <button type="button" data-commande="/api/serie/precedente">Série précédente</button>
        <button type="button" data-commande="/api/serie/suivante">Série suivante</button>
        <button type="button" data-commande="/api/serie/terminer">Série terminée</button>
        <button type="button" data-commande="/api/seance/pause">Pause</button>
        <button type="button" data-commande="/api/seance/reprendre">Reprendre</button>
        <button type="button" data-commande="/api/seance/abandonner">Abandonner</button>
    </nav>

</div>

<script>

    async function envoyerCommande(url) {
        const reponse = await fetch(url, { method: "POST" });
        const donnees = await reponse.json();
        if (!reponse.ok || !donnees.ok) {
            throw new Error(donnees.erreur || "Commande impossible");
        }
        mettreAJourEtat();
    }

    function initialiserCommandes() {
        document.querySelectorAll("[data-commande]").forEach((bouton) => {
            bouton.addEventListener("click", () => {
                envoyerCommande(bouton.dataset.commande).catch(console.error);
            });
        });

        document.addEventListener("keydown", (evenement) => {
            if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
                return;
            }
            const commandes = {
                r: "/api/serie/reset",
                e: "/api/serie/recommencer",
                ArrowLeft: "/api/serie/precedente",
                ArrowRight: "/api/serie/suivante",
                Enter: "/api/serie/terminer",
            };
            const url = commandes[evenement.key];
            if (url) {
                evenement.preventDefault();
                envoyerCommande(url).catch(console.error);
            }
        });
    }

    // ==========================================================
    // AFFICHAGE DE L'ENTRAÎNEMENT (multi-modes)
    // ----------------------------------------------------------
    // Le backend Python décide de tout (mode actif, valeurs, état
    // de l'exercice) via etat.mode. Ces fonctions se contentent
    // d'afficher — aucune logique métier ne doit vivre ici.
    //
    // Pour ajouter un futur mode : créer afficherModeXxx(etat),
    // l'ajouter au switch de updateWorkoutDisplay, et ajouter le
    // bloc HTML .workout-block--xxx correspondant dans #workoutCard.
    // ==========================================================

    let dernierReps = null;
    let dernierMaintienEntier = null;

    // Anime un nombre + son anneau lumineux (réutilisé par tous les modes)
    function declencherImpact(idValeur, idAnneau) {
        const valeurEl = document.getElementById(idValeur);
        const anneauEl = idAnneau ? document.getElementById(idAnneau) : null;

        valeurEl.classList.remove("hit");
        if (anneauEl) anneauEl.classList.remove("hit");
        void valeurEl.offsetWidth; // force le reflow pour rejouer l'animation
        valeurEl.classList.add("hit");
        if (anneauEl) anneauEl.classList.add("hit");
    }

    function updateWorkoutDisplay(etat) {
        // Compatibilité : un backend qui n'envoie pas encore "mode"
        // est traité comme du mode répétitions (comportement historique).
        const mode = etat.mode || "repetitions";
        const carte = document.getElementById("workoutCard");

        switch (mode) {
            case "repetitions":
                carte.dataset.mode = "repetitions";
                afficherModeRepetitions(etat);
                break;

            case "maintien":
                carte.dataset.mode = "maintien";
                afficherModeMaintien(etat);
                break;

            case "chrono":
                carte.dataset.mode = "chrono";
                afficherModeChrono(etat);
                break;

            case "amrap":
                carte.dataset.mode = "amrap";
                afficherModeAmrap(etat);
                break;

            default:
                // Mode inconnu : on retombe sur l'affichage répétitions
                // plutôt que de laisser l'interface vide/cassée.
                carte.dataset.mode = "repetitions";
                afficherModeRepetitions(etat);
        }
    }

    // ---------- MODE_REPETITIONS : "8 / 12 répétitions" ----------
    function afficherModeRepetitions(etat) {
        const repsEl = document.getElementById("reps");
        const cibleEl = document.getElementById("repsCible");
        const fill = document.getElementById("repsProgressFill");

        const actuel = Number(etat.repetitions) || 0;
        const cible = Number(etat.repetitions_cibles) || 0;

        if (cibleEl.textContent.trim() !== String(cible)) {
            cibleEl.textContent = cible;
        }

        if (dernierReps !== null && actuel !== dernierReps) {
            declencherImpact("reps", "ring");
        }
        repsEl.textContent = actuel;
        dernierReps = actuel;

        const pct = cible > 0 ? Math.max(0, Math.min(100, (actuel / cible) * 100)) : 0;
        fill.style.width = `${pct}%`;
    }

    // ---------- MODE_MAINTIEN : "7 / 15 secondes" ----------
    function afficherModeMaintien(etat) {
        const tempsEl = document.getElementById("maintienTemps");
        const tempsTexteEl = document.getElementById("maintienTempsTexte");
        const dureeTexteEl = document.getElementById("maintienDureeTexte");
        const fill = document.getElementById("maintienProgressFill");
        const statutEl = document.getElementById("maintienStatus");

        const actuel = Number(etat.temps_maintien) || 0;
        const cible = Number(etat.duree_maintien) || 0;
        const actuelArrondi = Math.floor(actuel);

        if (dernierMaintienEntier !== null && actuelArrondi !== dernierMaintienEntier) {
            declencherImpact("maintienTemps", "maintienRing");
        }
        tempsEl.textContent = actuelArrondi;
        tempsTexteEl.textContent = actuelArrondi;
        dureeTexteEl.textContent = cible;
        dernierMaintienEntier = actuelArrondi;

        const pct = cible > 0 ? Math.max(0, Math.min(100, (actuel / cible) * 100)) : 0;
        fill.style.width = `${pct}%`;

        // NOTE : la posture (correcte/cassée) est déduite de "stage".
        // Hypothèse à ajuster ici si le backend utilise d'autres libellés
        // (ex: "incorrect", "pause") — seule cette liste doit changer.
        const positionCassee = ["casse", "cassee", "incorrect", "mauvaise"].includes(
            String(etat.stage || "").toLowerCase()
        );

        if (positionCassee) {
            statutEl.textContent = "Position incorrecte";
            statutEl.classList.add("maintien-status--erreur");
        } else {
            statutEl.textContent = "Maintenir la position";
            statutEl.classList.remove("maintien-status--erreur");
        }
    }

    // ---------- MODE_CHRONO: "45 secondes restantes" ----------
    function afficherModeChrono(etat) {
        const el = document.getElementById("chronoTemps");
        el.textContent = Math.max(0,Math.round(Number(etat.temps_chrono) || 0));
    }
    // ---------- MODE_AMRAP (futur) : "12 répétitions en 60 secondes" ----------
    function afficherModeAmrap(etat) {
        document.getElementById("amrapReps").textContent = Number(etat.repetitions) || 0;
        document.getElementById("amrapTempsRestant").textContent =
            Math.max(0, Math.round(Number(etat.temps_amrap_restant) || 0));
    }

    // Met à jour un champ texte avec un petit fondu si la valeur a changé
    function mettreAJourChamp(id, nouvelleValeur, classeChangement = "changing") {
        const el = document.getElementById(id);
        const valeur = String(nouvelleValeur);
        if (el.textContent.trim() === valeur) return;

        el.classList.add(classeChangement);
        setTimeout(() => {
            el.textContent = valeur;
            el.classList.remove(classeChangement);
        }, 150);
    }

    function mettreAJourExercice(nouvelExercice) {
        const badge = document.getElementById("exerciseBadge");
        const valeurEl = document.getElementById("exercice");
        const valeur = String(nouvelExercice);
        if (valeurEl.textContent.trim() === valeur) return;

        badge.classList.add("changing");
        setTimeout(() => {
            valeurEl.textContent = valeur;
            badge.classList.remove("changing");
        }, 150);
    }

    function mettreAJourSeries(actuelle, total) {
        const badge = document.getElementById("seriesBadge");
        const valeurEl = document.getElementById("series");
        const valeur = `${actuelle} / ${total}`;
        if (valeurEl.textContent.trim() === valeur) return;

        badge.classList.add("changing");
        setTimeout(() => {
            valeurEl.textContent = valeur;
            badge.classList.remove("changing");
        }, 150);
    }

    function mettreAJourPoids(poids) {
        const badge = document.getElementById("weightBadge");
        const valeurEl = document.getElementById("weight");
        const valeur = (poids === null || poids === undefined || poids === 0) ? "—" : `${poids} kg`;
        if (valeurEl.textContent.trim() === valeur) return;

        badge.classList.add("changing");
        setTimeout(() => {
            valeurEl.textContent = valeur;
            badge.classList.remove("changing");
        }, 150);
    }

    // ---------- Phase (exercice / préparation / repos) ----------

    let dernierePhase = null;
    const CIRCONFERENCE_PREP = 2 * Math.PI * 70;

    function formaterTemps(secondes) {
        const t = Math.max(0, Math.round(Number(secondes) || 0));
        const min = Math.floor(t / 60);
        const sec = String(t % 60).padStart(2, "0");
        return `${min}:${sec}`;
    }

    function mettreAJourPhase(phase,tempsRestant,progressionPreparation,exercice,serieActuelle,nombreSeries,prochaineEtape) {
        const overlay = document.getElementById("restOverlay");
        const titre = document.getElementById("restTitle");
        const breathe = document.getElementById("breatheCircle");
        const prepWrap = document.getElementById("prepRingWrap");
        const prepRing = document.getElementById("prepRingProgress");
        const prepPercent = document.getElementById("prepPercent");
        const temps = document.getElementById("restTime");
        const suivant = document.getElementById("restNext");
        const {
            exercice: prochainExercice,
            poids: prochainPoids,
            series: prochainSerie,
            repetitions: prochainRepetitions,
            mode: prochainMode,
            duree: prochainDuree,
        } = prochaineEtape || {};

        if (phase === "termine") {
            overlay.classList.remove("visible");
            dernierePhase = phase;
            return;
        }
        const enPause = phase !== "exercice";

        if (!enPause) {
            overlay.classList.remove("visible");
            dernierePhase = phase;
            return;
        }

        overlay.classList.add("visible");
        if (prochainExercice) {
            const nombreSeries = `${prochainSerie} ${prochainSerie > 1 ? "séries" : "série"}`;
            let consigne;

            switch (prochainMode) {
                case "maintien":
                    consigne = `${nombreSeries} × ${prochainDuree} s de maintien`;
                    break;
                case "chrono":
                    consigne = `${nombreSeries} × ${prochainDuree} s`;
                    break;
                case "amrap":
                    consigne = `${nombreSeries} × AMRAP ${prochainDuree} s`;
                    break;
                case "repetitions":
                default:
                    consigne = `${nombreSeries} × ${prochainRepetitions} reps`;
            }

            suivant.innerHTML = `
                Prochain :
                <strong>${prochainExercice}</strong><br>
                ${consigne}
                ${prochainPoids ? `<br>${prochainPoids} kg` : ""}
            `;

        } else {
            suivant.innerHTML = `Fin de séance`;
        }

        if (phase === "preparation") {
            titre.textContent = "Préparation";
            breathe.classList.add("hidden-mode");
            prepWrap.classList.add("active");

            const pct = Math.max(0, Math.min(100, Number(progressionPreparation) || 0));
            prepRing.style.strokeDashoffset = CIRCONFERENCE_PREP * (1 - pct / 100);
            prepPercent.textContent = `${Math.round(pct)}%`;
        } else {
            // Repos ou toute autre phase de pause : respiration + compte à rebours
            titre.textContent =
                phase === "recuperation_serie" ? "Récupération" :
                phase === "repos_exercice" ? "Repos" :
                String(phase).charAt(0).toUpperCase() + String(phase).slice(1);
            breathe.classList.remove("hidden-mode");
            prepWrap.classList.remove("active");
            temps.textContent = formaterTemps(tempsRestant);
        }

        dernierePhase = phase;
    }

    function definirStatut(enLigne) {
        const dot = document.getElementById("statusDot");
        const text = document.getElementById("statusText");
        if (enLigne) {
            dot.classList.remove("offline");
            text.textContent = "En direct";
        } else {
            dot.classList.add("offline");
            text.textContent = "Connexion perdue";
        }
    }

    // ---------- Bulle de progression du maintien ----------

    const CIRCONFERENCE = 2 * Math.PI * 70;
    let dernierMaintienTermine = false;

    function creerParticules() {
        const burst = document.getElementById("burst");
        burst.innerHTML = "";
        const nombre = 14;

        for (let i = 0; i < nombre; i++) {
            const particule = document.createElement("span");
            particule.className = "particle";

            const angle = (360 / nombre) * i + (Math.random() * 16 - 8);
            const distance = 55 + Math.random() * 35;
            const rad = (angle * Math.PI) / 180;

            particule.style.setProperty("--tx", `${Math.cos(rad) * distance}px`);
            particule.style.setProperty("--ty", `${Math.sin(rad) * distance}px`);

            burst.appendChild(particule);
        }
    }

    function declencherEclatement() {
        const container = document.getElementById("holdContainer");
        const bulle = document.getElementById("holdBubble");

        bulle.classList.add("pop");
        container.classList.add("flash");
        creerParticules();

        setTimeout(() => {
            bulle.classList.remove("pop");
            container.classList.remove("flash", "visible");
            bulle.style.transform = "scale(0.22)";
            document.getElementById("holdRingProgress").style.strokeDashoffset = CIRCONFERENCE;
            document.getElementById("holdPercent").textContent = "0%";
            document.getElementById("burst").innerHTML = "";
        }, 600);
    }

    function mettreAJourMaintien(progression, termine) {
        const container = document.getElementById("holdContainer");
        const bulle = document.getElementById("holdBubble");
        const anneau = document.getElementById("holdRingProgress");
        const pourcentEl = document.getElementById("holdPercent");

        const pct = Math.max(0, Math.min(100, Number(progression) || 0));

        // Déclenche l'éclatement une seule fois, au moment où le maintien se termine
        if (termine && !dernierMaintienTermine) {
            dernierMaintienTermine = termine;
            declencherEclatement();
            return;
        }
        dernierMaintienTermine = termine;

        // Pendant l'éclatement, on laisse l'animation faire son travail
        if (bulle.classList.contains("pop")) return;

        if (pct > 0) {
            container.classList.add("visible");
        } else {
            container.classList.remove("visible");
        }

        anneau.style.strokeDashoffset = CIRCONFERENCE * (1 - pct / 100);
        bulle.style.transform = `scale(${0.22 + (pct / 100) * 0.78})`;
        pourcentEl.textContent = `${Math.round(pct)}%`;
    }

    function mettreAJourEtat() {

        fetch("/etat")
            .then(response => response.json())

            .then(data => {

                definirStatut(true);


                // ======================================
                // INFORMATIONS GENERALES
                // ======================================

                mettreAJourExercice(data.exercice_actuel);

                mettreAJourSeries(
                    data.serie_actuelle,
                    data.nombre_series
                );

                mettreAJourPoids(data.poids);


                mettreAJourChamp(
                    "position",
                    data.position_actuelle || "Aucune"
                );

                mettreAJourChamp(
                    "stage",
                    data.stage || "Aucune"
                );


                // ======================================
                // AFFICHAGE DU MODE ACTUEL
                // repetitions / maintien / chrono / amrap
                // ======================================

                updateWorkoutDisplay(data);



                // ======================================
                // MAINTIEN (bulle centrale)
                // ======================================

                mettreAJourMaintien(
                    data.progression_maintien || 0,
                    data.maintien_termine || false
                );



                // ======================================
                // PHASE GENERALE
                // préparation / repos / exercice
                // ======================================

                mettreAJourPhase(
                    data.phase,
                    data.temps_repos_restant,
                    data.progression_preparation,
                    data.exercice_actuel,
                    data.serie_actuelle,
                    data.nombre_series,
                    data.prochaine_etape
                );


            })


            .catch(error => {

                definirStatut(false);

                console.error(
                    "Erreur récupération état :",
                    error
                );

            });
        }

    initialiserCommandes();
    setInterval(mettreAJourEtat, 100);
    mettreAJourEtat();

</script>

</body>

</html>
