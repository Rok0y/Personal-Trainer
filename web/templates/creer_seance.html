<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer une séance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='editeur.css') }}">
<style>
    /* Propre à cette page : la grille n'a qu'une poignée et un bouton
       d'entrelacement en tête, là où l'éditeur ajoute deux flèches. */
    .bloc { grid-template-columns: 28px 40px 2fr repeat(8, 1fr) 40px; }

    .actions { margin-top: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    #enregistrer { background: var(--orange); color: #0a0d13; border-color: var(--orange); box-shadow: 0 0 24px var(--orange-glow); }
    #enregistrer:hover { color: #0a0d13; border-color: var(--orange); opacity: .9; }

    @media (max-width: 700px) {
        .champ:first-child, .champ:nth-child(2) { grid-column: span 3; }
    }
</style>
</head>
<body><main>
<p class="kicker">Personal Trainer</p>
<h1>Créer une séance</h1>
<p class="hint">Choisis un exercice et un mode. Les durées et les temps de repos sont en secondes.</p>
<label for="nom">Nom de la séance <input id="nom" required></label>
<div id="blocs"></div>
<div class="actions">
    <button id="ajouter" type="button">Ajouter un exercice</button>
    <button id="enregistrer" type="button">Enregistrer</button>
    <a class="btn" href="/">Annuler</a>
</div>
<script src="{{ url_for('static', filename='reordonner.js') }}"></script>
<script>
const exercices = {{ exercices|tojson }};
const echauffements = {{ echauffements|tojson }};
const blocs = document.getElementById("blocs");

// Les deux catalogues sont séparés côté serveur : un échauffement n'a ni
// matériel, ni objectif, ni record. On les regroupe ici pour que la liste
// dise clairement lesquels attendent le mode « Échauffement ».
function optionsExercices(choisi = "") {
    const groupe = (titre, noms) =>
        `<optgroup label="${titre}">${noms
            .map((n) => `<option ${n === choisi ? "selected" : ""}>${n}</option>`)
            .join("")}</optgroup>`;

    return (
        groupe("Échauffement (avant l'entraînement)", Object.keys(echauffements)) +
        groupe("Exercices", Object.keys(exercices))
    );
}

function ajouterBloc() {
    const ligne = document.createElement("div");
    ligne.className = "bloc";

    const exercicesOptions = optionsExercices();

    ligne.innerHTML = `
        <span class="drag-poignee" title="Glisser pour déplacer" aria-hidden="true">⠿</span>
        <button type="button" class="entrelace-btn" title="Entrelacer avec le suivant">⟷</button>
        <div class="champ">
            <label>Exercice</label>
            <select class="exercice">${exercicesOptions}</select>
        </div>
        <div class="champ">
            <label><span class="mode-pastille"></span> Mode</label>
            <select class="mode">
                <option value="repetitions">Repetitions</option>
                <option value="maintien">Maintien</option>
                <option value="chrono">Chrono</option>
                <option value="amrap">AMRAP</option>
                <option value="echauffement">Échauffement</option>
            </select>
        </div>
        <div class="champ">
            <label>Poids <span>en kg</span></label>
            <input class="poids" type="number" min="0" value="0">
        </div>
        <div class="champ">
            <label>Séries</label>
            <input class="series" type="number" min="1" value="1">
        </div>
        <div class="champ">
            <label>Répétitions</label>
            <input class="repetitions" type="number" min="0" value="10">
        </div>
        <div class="champ">
            <label>Durée <span>secondes</span></label>
            <input class="duree" type="number" min="0" value="0">
        </div>
        <div class="champ">
            <label>Repos série <span>secondes</span></label>
            <input class="reposEntre" type="number" min="0" value="30">
        </div>
        <div class="champ">
            <label>Repos exercice <span>secondes</span></label>
            <input class="reposApres" type="number" min="0" value="30">
        </div>
        <button type="button" class="sup-btn" aria-label="Supprimer cet exercice">X</button>
    `;
    
    // Gestion du bouton d'entrelacement : simple drapeau « avec le bloc
    // suivant », le nom du partenaire est résolu à l'enregistrement.
    const entrelaceBtn = ligne.querySelector(".entrelace-btn");

    entrelaceBtn.onclick = (e) => {
        e.preventDefault();

        if (!entrelaceBtn.classList.contains("active") && !ligne.nextElementSibling) {
            alert("Aucun exercice suivant à entrelacer");
            return;
        }

        entrelaceBtn.classList.toggle("active");
        rafraichir();
    };

    // Gestion du bouton de suppression
    ligne.querySelector(".sup-btn").onclick = () => { ligne.remove(); rafraichir(); };
    ligne.querySelector(".mode").onchange = rafraichir;
    ligne.querySelector(".exercice").onchange = rafraichir;

    blocs.appendChild(ligne);
}

// Recalcule tout ce qui dépend de la POSITION des blocs. Indispensable après
// un ajout, une suppression ou un déplacement : `entrelace_avec` désigne
// « le bloc juste en dessous », donc réordonner change le partenaire, et le
// dernier bloc ne peut être entrelacé avec rien.
function rafraichir() {
    const lignes = [...blocs.querySelectorAll(".bloc")];
    lignes.forEach((ligne, index) => {
        ligne.dataset.mode = ligne.querySelector(".mode").value;

        const entrelaceBtn = ligne.querySelector(".entrelace-btn");
        const suivant = lignes[index + 1];
        if (!suivant) entrelaceBtn.classList.remove("active");
        const actif = entrelaceBtn.classList.contains("active");
        ligne.classList.toggle("entrelace", actif);
        entrelaceBtn.title = actif
            ? `Entrelacé avec : ${suivant.querySelector(".exercice").value}`
            : "Entrelacer avec le suivant";
    });
}

document.getElementById("ajouter").onclick = () => { ajouterBloc(); rafraichir(); };
ajouterBloc();
rafraichir();
activerReordonnancement(blocs, rafraichir);

document.getElementById("enregistrer").onclick = async () => {
    const nom = document.getElementById("nom").value.trim();
    const lignes = [...document.querySelectorAll(".bloc")];
    
    const data = {
        nom,
        blocs: lignes.map((l, idx) => {
            const bloc = {
                exercice: l.querySelector(".exercice").value,
                mode: l.querySelector(".mode").value,
                poids: Number(l.querySelector(".poids").value),
                series: Number(l.querySelector(".series").value),
                repetitions: Number(l.querySelector(".repetitions").value),
                duree: Number(l.querySelector(".duree").value),
                repos_entre_series: Number(l.querySelector(".reposEntre").value),
                repos_apres: Number(l.querySelector(".reposApres").value)
            };
            
            // Ajouter entrelace_avec si l'utilisateur a cliqué sur le bouton
            const suivant = lignes[idx + 1];
            if (suivant && l.querySelector(".entrelace-btn").classList.contains("active")) {
                bloc.entrelace_avec = suivant.querySelector(".exercice").value;
            }

            return bloc;
        })
    };
    
    const rep = await fetch("/api/seances", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });
    
    if (rep.ok) {
        location.href = "/";
    } else {
        const err = await rep.json();
        alert("Erreur: " + (err.erreur || "Impossible de sauvegarder"));
    }
};
</script></main></body></html>
