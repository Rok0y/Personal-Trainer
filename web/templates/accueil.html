<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Trainer - Selection</title>
    <style>
        :root { --ink: #172026; --paper: #f4f0e8; --accent: #ef5b35; --line: #d8d0c3; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: Georgia, serif; }
        main { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0; }
        header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 42px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
        h1 { margin: 0; font-size: clamp(42px, 8vw, 88px); line-height: .9; font-weight: 400; }
        .kicker { margin: 0 0 8px; color: var(--accent); font: 700 12px Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
        .hint { max-width: 250px; margin: 0; font: 14px/1.5 Arial, sans-serif; color: #657078; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
        .session { border: 1px solid var(--line); background: rgba(255,255,255,.35); padding: 22px; text-align: left; cursor: pointer; color: inherit; font: inherit; }
        .session:hover, .session.selected { border-color: var(--accent); background: #fffaf1; }
        .session h2 { margin: 0 0 18px; font-size: 25px; font-weight: 400; }
        .session p { margin: 6px 0; color: #657078; font: 14px Arial, sans-serif; }
        .session details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; font: 13px/1.6 Arial, sans-serif; }
        .session summary { color: var(--accent); cursor: pointer; }
        .session ul { padding-left: 18px; color: #657078; }
        .start { margin-top: 28px; border: 0; background: var(--accent); color: white; padding: 14px 22px; font: 700 14px Arial, sans-serif; cursor: pointer; }
        .start:disabled { opacity: .4; cursor: not-allowed; }
        a { color: var(--ink); font: 14px Arial, sans-serif; }
    </style>
</head>
<body>
<main>
    <header>
        <div><p class="kicker">Personal Trainer</p><h1>Choisis ton<br>entrainement.</h1></div>
        <p class="hint">Selectionne une seance, puis demarre quand tu es pret.</p>
    </header>
    <section class="grid" aria-label="Seances disponibles">
        {% for identifiant, seance in seances.items() %}
        <button class="session{% if identifiant == selection %} selected{% endif %}" data-seance="{{ identifiant }}" type="button">
            <h2>{{ seance.nom|replace('_', ' ')|title }}</h2>
            <p>{{ seance.nombre_exercices }} exercices</p>
            <details>
                <summary>Voir le contenu</summary>
                <ul>
                {% for exercice in seance.exercices %}
                    <li>{{ exercice.nom or exercice.exercice }} · {{ exercice.series }} séries · {{ exercice.repetitions or exercice.duree }} {% if exercice.mode == 'maintien' or exercice.mode == 'chrono' %}secondes{% else %}répétitions{% endif %}</li>
                {% endfor %}
                </ul>
            </details>
        </button>
        {% endfor %}
    </section>
    <button class="start" id="demarrer" type="button" disabled>Demarrer la seance</button>
    <p><a href="/historique">Voir l'historique</a></p>
    <p><a href="/creer-seance">Créer une séance personnalisée</a></p>
</main>
<script>
    let selection = {{ selection|tojson }};
    const boutonDemarrer = document.getElementById("demarrer");
    function actualiserSelection() {
        document.querySelectorAll("[data-seance]").forEach((bouton) => {
            bouton.classList.toggle("selected", bouton.dataset.seance === selection);
        });
        boutonDemarrer.disabled = !selection;
    }
    document.querySelectorAll("[data-seance]").forEach((bouton) => {
        bouton.addEventListener("click", async () => {
            const reponse = await fetch("/api/seance/selectionner", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nom: bouton.dataset.seance }) });
            const donnees = await reponse.json();
            if (donnees.ok) { selection = bouton.dataset.seance; actualiserSelection(); }
        });
    });
    boutonDemarrer.addEventListener("click", async () => {
        const reponse = await fetch("/api/seance/demarrer", { method: "POST" });
        if (reponse.ok) { window.location.href = "/"; }
    });
    actualiserSelection();
</script>
</body>
</html>
