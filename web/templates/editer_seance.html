<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditer une séance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='editeur.css') }}">
<style>
    /* Propre à cette page : elle est plus large que la création (deux
       boutons de plus en tête de bloc) et affiche des flèches ▲▼. */
    main { width: min(1040px, calc(100% - 40px)); }
    .bloc { grid-template-columns: 28px 34px 34px 40px 2fr repeat(7, 1fr) 40px; }

    .actions { margin-top: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    #enregistrer { background: var(--orange); color: #0a0d13; border-color: var(--orange); box-shadow: 0 0 24px var(--orange-glow); }
    #enregistrer:hover { color: #0a0d13; border-color: var(--orange); opacity: .9; }

    .bloc > .move-btn { color: var(--muted); font-size: 15px; padding: 8px 6px; }
    .bloc .move-btn:hover { border-color: var(--teal); color: var(--teal); }

    @media (max-width: 700px) {
        .champ:nth-child(4), .champ:nth-child(5) { grid-column: span 3; }
    }
</style>
</head>
<body><main>
<p class="kicker">Personal Trainer</p>
<h1>Éditer la séance</h1>
<p class="hint">Réordonne en glissant la poignée ⠿ (ou avec ▲ ▼ au clavier), entrelace un exercice avec le suivant grâce à ⟷ (les séries alternent entre les deux), ajuste les repos en secondes.</p>
<label for="nom">Nom de la séance <input id="nom" required></label>
<div id="blocs"></div>
<div class="actions">
    <button id="ajouter" type="button">Ajouter un exercice</button>
    <button id="enregistrer" type="button">Enregistrer</button>
    <a class="btn" href="/">Annuler</a>
</div>

<script src="{{ url_for('static', filename='reordonner.js') }}"></script>
<script>
const exercices = {{ exercices|tojson }};
const echauffements = {{ echauffements|tojson }};
const seanceNom = {{ seance_nom|tojson }};
const seanceExercices = {{ seance_exercices|tojson }};
const blocs = document.getElementById("blocs");

// Modes dont la cible est une durée et non un nombre de répétitions.
const MODES_DUREE = ["maintien", "chrono", "echauffement"];

document.getElementById("nom").value = seanceNom;

function nomExercice(data) {
    return data.exercice || data.nom || "";
}

// Les deux catalogues sont séparés côté serveur : un échauffement n'a ni
// matériel, ni objectif, ni record. On les regroupe ici pour que la liste
// dise clairement lesquels attendent le mode « Échauffement ».
function optionsExercices(choisi = "") {
    const groupe = (titre, noms) =>
        `<optgroup label="${titre}">${noms
            .map((n) => `<option ${n === choisi ? "selected" : ""}>${n}</option>`)
            .join("")}</optgroup>`;

    const connus = [...Object.keys(exercices), ...Object.keys(echauffements)];
    // Un nom absent des deux catalogues (exercice retiré depuis) ferait
    // sélectionner la première option par le navigateur : enregistrer
    // remplacerait alors silencieusement l'exercice du bloc.
    const orphelin = choisi && !connus.includes(choisi)
        ? groupe("Inconnu", [choisi])
        : "";

    return (
        orphelin +
        groupe("Échauffement (avant l'entraînement)", Object.keys(echauffements)) +
        groupe("Exercices", Object.keys(exercices))
    );
}

function creerBloc(data = {}) {
    const ligne = document.createElement("div");
    ligne.className = "bloc";

    const choisi = nomExercice(data);
    const options = optionsExercices(choisi);
    const estDuree = MODES_DUREE.includes(data.mode);

    ligne.innerHTML = `
        <span class="drag-poignee" title="Glisser pour déplacer" aria-hidden="true">⠿</span>
        <button type="button" class="move-btn" data-sens="-1" title="Monter">▲</button>
        <button type="button" class="move-btn" data-sens="1" title="Descendre">▼</button>
        <button type="button" class="entrelace-btn" title="Entrelacer avec l'exercice suivant">⟷</button>
        <div class="champ">
            <label>Exercice</label>
            <select class="exercice">${options}</select>
        </div>
        <div class="champ">
            <label><span class="mode-pastille"></span> Mode</label>
            <select class="mode">
                <option value="repetitions" ${data.mode === "repetitions" ? "selected" : ""}>Repetitions</option>
                <option value="maintien" ${data.mode === "maintien" ? "selected" : ""}>Maintien</option>
                <option value="chrono" ${data.mode === "chrono" ? "selected" : ""}>Chrono</option>
                <option value="amrap" ${data.mode === "amrap" ? "selected" : ""}>AMRAP</option>
                <option value="echauffement" ${data.mode === "echauffement" ? "selected" : ""}>Échauffement</option>
            </select>
        </div>
        <div class="champ">
            <label>Poids <span>en kg</span></label>
            <input class="poids" type="number" min="0" step="0.5" value="${data.poids ?? 0}">
        </div>
        <div class="champ">
            <label>Séries</label>
            <input class="series" type="number" min="1" value="${data.series ?? 1}">
        </div>
        <div class="champ">
            <label>Répétitions</label>
            <input class="repetitions" type="number" min="0" value="${data.repetitions ?? (estDuree ? 0 : 10)}">
        </div>
        <div class="champ">
            <label>Durée <span>secondes</span></label>
            <input class="duree" type="number" min="0" value="${data.duree ?? 0}">
        </div>
        <div class="champ">
            <label>Repos série <span>secondes</span></label>
            <input class="reposEntre" type="number" min="0" value="${data.repos_entre_series ?? 30}">
        </div>
        <div class="champ">
            <label>Repos exercice <span>secondes</span></label>
            <input class="reposApres" type="number" min="0" value="${data.repos_apres ?? 30}">
        </div>
        <button type="button" class="sup-btn" aria-label="Supprimer cet exercice">X</button>
    `;

    // Le commentaire se modifie depuis l'accueil : on le transporte tel quel
    // pour ne pas l'effacer en enregistrant depuis cette page.
    ligne.dataset.commentaire = data.commentaire || "";

    const entrelaceBtn = ligne.querySelector(".entrelace-btn");
    // L'entrelacement est un simple drapeau « avec le bloc suivant » : le nom du
    // partenaire est recalculé à l'enregistrement, donc il survit au réordonnancement.
    if (data.entrelace_avec) entrelaceBtn.classList.add("active");
    entrelaceBtn.onclick = () => {
        if (!entrelaceBtn.classList.contains("active") && !ligne.nextElementSibling) {
            window.alert("Aucun exercice suivant à entrelacer.");
            return;
        }
        entrelaceBtn.classList.toggle("active");
        rafraichir();
    };

    ligne.querySelectorAll(".move-btn").forEach((bouton) => {
        bouton.onclick = () => deplacer(ligne, Number(bouton.dataset.sens));
    });
    ligne.querySelector(".sup-btn").onclick = () => { ligne.remove(); rafraichir(); };
    ligne.querySelector(".exercice").onchange = rafraichir;
    ligne.querySelector(".mode").onchange = rafraichir;

    blocs.appendChild(ligne);
    return ligne;
}

function deplacer(ligne, sens) {
    const voisin = sens < 0 ? ligne.previousElementSibling : ligne.nextElementSibling;
    if (!voisin) return;
    if (sens < 0) blocs.insertBefore(ligne, voisin);
    else blocs.insertBefore(voisin, ligne);
    rafraichir();
}

function rafraichir() {
    const lignes = [...blocs.querySelectorAll(".bloc")];
    lignes.forEach((ligne, index) => {
        ligne.dataset.mode = ligne.querySelector(".mode").value;

        const entrelaceBtn = ligne.querySelector(".entrelace-btn");
        const suivant = lignes[index + 1];
        // Le dernier bloc ne peut pas être entrelacé : il n'a pas de suivant.
        if (!suivant) entrelaceBtn.classList.remove("active");
        const actif = entrelaceBtn.classList.contains("active");
        ligne.classList.toggle("entrelace", actif);
        entrelaceBtn.title = actif
            ? `Entrelacé avec : ${suivant.querySelector(".exercice").value}`
            : "Entrelacer avec l'exercice suivant";
        ligne.querySelector('.move-btn[data-sens="-1"]').disabled = index === 0;
        ligne.querySelector('.move-btn[data-sens="1"]').disabled = index === lignes.length - 1;
    });
}

seanceExercices.forEach((exercice) => creerBloc(exercice));
if (!seanceExercices.length) creerBloc();
rafraichir();
activerReordonnancement(blocs, rafraichir);

document.getElementById("ajouter").onclick = () => { creerBloc(); rafraichir(); };

document.getElementById("enregistrer").onclick = async () => {
    const nom = document.getElementById("nom").value.trim();
    if (!nom) { window.alert("Le nom de la séance est requis."); return; }

    const lignes = [...blocs.querySelectorAll(".bloc")];
    const blocsData = lignes.map((ligne, index) => {
        const mode = ligne.querySelector(".mode").value;
        const bloc = {
            exercice: ligne.querySelector(".exercice").value,
            mode,
            poids: Number(ligne.querySelector(".poids").value) || 0,
            series: Math.max(1, Number(ligne.querySelector(".series").value) || 1),
            repetitions: Number(ligne.querySelector(".repetitions").value) || 0,
            duree: Number(ligne.querySelector(".duree").value) || 0,
            repos_entre_series: Number(ligne.querySelector(".reposEntre").value) || 0,
            repos_apres: Number(ligne.querySelector(".reposApres").value) || 0,
            commentaire: ligne.dataset.commentaire || "",
        };
        const suivant = lignes[index + 1];
        if (suivant && ligne.querySelector(".entrelace-btn").classList.contains("active")) {
            bloc.entrelace_avec = suivant.querySelector(".exercice").value;
        }
        return bloc;
    });

    const reponse = await fetch(`/api/seances/${encodeURIComponent(seanceNom)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nom, blocs: blocsData }),
    });
    const donnees = await reponse.json();
    if (donnees.ok) window.location.href = "/";
    else window.alert(donnees.erreur || "Impossible de sauvegarder la séance.");
};
</script></main></body></html>
